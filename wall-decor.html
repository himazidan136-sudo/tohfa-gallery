<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحفة | Wall Decor</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tohfa/products.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-flex">
            <div class="logo">TOHFA <span>تحفة</span></div>
            <a href="index.html" class="glass-btn">العودة للرئيسية</a>
            <div class="cart-btn-nav" onclick="toggleCart()">
    <span class="glass-btn">🛒 السلة <span class="cart-badge" id="cartBadge">0</span></span>
</div>
        </div>
    </nav>

    <div class="container" style="margin-top: 120px;">
        <div class="product-grid">
            <!-- منتج 1 -->
            <div class="product-card">
                <img src="tohfa/1.jpg.jpeg" class="product-img">
                <span class="product-name">تابلوه خط عربي فخم</span>
                <span class="product-price">1255 ج.م</span>
                <button class="order-btn" onclick="orderNow('تابلوه خط عربي فخم', 1255, 'tohfa/1.jpg.jpeg')">طلب المنتج</button>
                <button class="order-btn" onclick="addToCart('تابلوه خط عربي فخم', 1255, 'tohfa/1.jpg.jpeg')">إضافة للسلة</button>
            </div>
            <!-- منتج 2 -->
            <div class="product-card">
                <img src="tohfa/2.jpg.jpeg" class="product-img">
                <span class="product-name">برواز مودرن شيك</span>
                <span class="product-price">800 ج.م</span>
                <button class="order-btn" onclick="orderNow('برواز مودرن شيك', 800, 'tohfa/2.jpg.jpeg')">طلب المنتج</button>
                <button class="order-btn" onclick="addToCart('برواز مودرن شيك', 800, 'tohfa/2.jpg.jpeg')">إضافة للسلة</button>
            </div>
        </div>
    </div>

    <!-- 🐞 تم حذف نافذة ونظام الطلب القديمين من هنا (نفس سبب الحذف
         في باقي صفحات المنتجات: تعارض IDs مع نظام السلة تحت) -->
    <div id="cartOverlay" class="cart-overlay">
    <div class="cart-header">
        <h2>سلة المقتنيات</h2>
        <div onclick="toggleCart()" style="cursor:pointer; font-size:30px; color:var(--primary)">&times;</div>
    </div>
    <div class="cart-items-list" id="cartItemsList"></div>
    <div class="cart-footer">
        <div class="total-row">
            <span>الإجمالي:</span>
            <span id="cartTotal">0 ج.م</span>
        </div>
        <button class="order-btn" onclick="checkout()" style="width:100%">إتمام الطلب</button>
    </div>
</div>
<!-- أبلكيشن طلب المقتنيات (Modal) -->
<div id="orderModal" class="modal-overlay">
    <div class="modal-content glass-card">
        <span class="close-btn" onclick="closeOrderForm()">&times;</span>
        <h3 id="mTitle" style="text-align:center; margin-bottom:20px; font-family:'Reem Kufi'; color:var(--primary);">استمارة طلب مقتنيات</h3>
        
        <form id="orderForm">
            <!-- بيانات العميل -->
            <input type="text" name="الاسم" id="cName" placeholder="الاسم بالكامل" required>
            <input type="tel" name="الهاتف" id="cPhone" placeholder="رقم الهاتف (واتساب)" required>
            <textarea name="العنوان" id="cAddr" rows="3" placeholder="العنوان بالتفصيل لسهولة التوصيل" required></textarea>
            
            <!-- حقول مخفية بيتم ملوها أوتوماتيك من السلة -->
            <input type="hidden" name="تفاصيل_الأوردر" id="hiddenProd">
            <input type="hidden" name="إجمالي_السعر" id="hiddenPrice">

            <button type="button" id="submitBtn" class="order-btn" onclick="sendFinalOrder()">تأكيد وإرسال الطلب</button>
        </form>
    </div>
</div>
<!-- نافذة تكبير الصور (Lightbox) -->

<!-- ربط ملف الجافا سكريبت الجديد -->
<script src="tohfa-script.js"></script>
<div id="imageModal" class="image-lightbox">
    <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
    <img id="fullImage" src="" alt="Enlarged Image">
</div>
</body>
</html>
