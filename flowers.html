<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحفة | flowers</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tohfa/products.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-flex">
            <div class="logo">TOHFA <span>تحفة</span></div>
            <a href="index.html" class="glass-btn">العودة للرئيسية</a>
            <div class="cart-btn-nav" onclick="toggleCart()">
    <span class="glass-btn">🛒 السلة <span class="cart-badge" id="cartBadge">0</span></span>
</div>
        </div>
    </nav>

    <div class="container" style="margin-top: 120px;">
        <div class="product-grid">
            <!-- منتج 1 -->
            <div class="product-card">
                <img src="tohfa/1.jpg.jpeg" class="product-img">
                <span class="product-name">تابلوه خط عربي فخم</span>
                <span class="product-price">1,200 ج.م</span>
                <button class="order-btn" onclick="openForm('تابلوه خط عربي فخم', '1,200 ج.م')">طلب المنتج</button> 
                <button class="order-btn" onclick="addToCart('اسم الأنتيك', 1500, 'tohfa/image.jpg')">إضافة للسلة</button>
            </div>
            <!-- منتج 2 -->
            <div class="product-card">
                <img src="tohfa/2.jpg.jpeg" class="product-img">
                <span class="product-name">برواز مودرن شيك</span>
                <span class="product-price">950 ج.م</span>
                <button class="order-btn" onclick="openForm('برواز مودرن شيك', '950 ج.م')">طلب المنتج</button>
                <button class="order-btn" onclick="addToCart('اسم الأنتيك', 1500, 'tohfa/image.jpg')">إضافة للسلة</button>
            </div>
        </div>
    </div>

    <!-- نافذة الأبلكيشن (Modal) -->
    <div id="orderModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeForm()">&times;</span>
            <h3 id="mTitle" style="text-align:center; margin-bottom:20px; color:white;">استمارة طلب</h3>
            
            <form id="orderForm">
                <!-- الأسامي name بالانجليزي لضمان وصول الرسالة -->
                <input type="text" name="customer_name" id="cName" placeholder="الاسم بالكامل" required>
                <input type="tel" name="phone_number" id="cPhone" placeholder="رقم الهاتف" required>
                <textarea name="address" id="cAddr" rows="3" placeholder="العنوان بالتفصيل" required></textarea>
                
                <!-- بيانات المنتج مخفية -->
                <input type="hidden" name="product_name" id="hiddenProd">
                <input type="hidden" name="product_price" id="hiddenPrice">

                <button type="button" id="submitBtn" class="order-btn" onclick="sendOrder()">تأكيد الطلب</button>
            </form>
        </div>
    </div>

    <script>
        let selectedP, selectedPr;

        function openForm(name, price) { 
            selectedP = name; 
            selectedPr = price;
            document.getElementById('mTitle').innerText = "طلب: " + name;
            document.getElementById('hiddenProd').value = name;
            document.getElementById('hiddenPrice').value = price;
            // السطر اللي بيخلي الفورم يظهر
            document.getElementById('orderModal').style.display = 'flex'; 
        }

        function closeForm() { 
            document.getElementById('orderModal').style.display = 'none'; 
        }

        async function sendOrder() {
            const form = document.getElementById('orderForm');
            const btn = document.getElementById('submitBtn');

            if(form.checkValidity()) {
                btn.innerText = "جاري الإرسال...";
                btn.disabled = true;

                const response = await fetch("https://formspree.io/f/xrewzqnn", {
                    method: "POST",
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    alert("تم استلام طلبك بنجاح! سنتواصل معك فوراً.");
                    form.reset();
                    closeForm();
                } else {
                    alert("حدث خطأ في الإرسال، حاول مرة أخرى.");
                }
                btn.innerText = "تأكيد الطلب";
                btn.disabled = false;
            } else {
                alert("برجاء ملء البيانات كاملة");
            }
        }
    </script>
    <div id="cartOverlay" class="cart-overlay">
    <div class="cart-header">
        <h2>سلة المقتنيات</h2>
        <div onclick="toggleCart()" style="cursor:pointer; font-size:30px; color:var(--primary)">&times;</div>
    </div>
    <div class="cart-items-list" id="cartItemsList"></div>
    <div class="cart-footer">
        <div class="total-row">
            <span>الإجمالي:</span>
            <span id="cartTotal">0 ج.م</span>
        </div>
        <button class="order-btn" onclick="checkout()" style="width:100%">إتمام الطلب</button>
    </div>
</div>
<!-- أبلكيشن طلب المقتنيات (Modal) -->
<div id="orderModal" class="modal-overlay">
    <div class="modal-content glass-card">
        <span class="close-btn" onclick="closeOrderForm()">&times;</span>
        <h3 id="mTitle" style="text-align:center; margin-bottom:20px; font-family:'Reem Kufi'; color:var(--primary);">استمارة طلب مقتنيات</h3>
        
        <form id="orderForm">
            <!-- بيانات العميل -->
            <input type="text" name="الاسم" id="cName" placeholder="الاسم بالكامل" required>
            <input type="tel" name="الهاتف" id="cPhone" placeholder="رقم الهاتف (واتساب)" required>
            <textarea name="العنوان" id="cAddr" rows="3" placeholder="العنوان بالتفصيل لسهولة التوصيل" required></textarea>
            
            <!-- حقول مخفية بيتم ملوها أوتوماتيك من السلة -->
            <input type="hidden" name="تفاصيل_الأوردر" id="hiddenProd">
            <input type="hidden" name="إجمالي_السعر" id="hiddenPrice">

            <button type="button" id="submitBtn" class="order-btn" onclick="sendFinalOrder()">تأكيد وإرسال الطلب</button>
        </form>
    </div>
</div>
<!-- ربط ملف الجافا سكريبت الجديد -->
<script src="tohfa-script.js"></script>
</body>
</html>
